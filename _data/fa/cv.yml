      year: اکتبر ۲۰۲۳ – تاکنون
      description:
        - "مدیریت عملیات روزانه آزمایشگاه واقعیت مجازی با تمرکز بر علوم اعصاب شناختی."
        - "همکاری با تیمی چندرشته‌ای از مهندسان و روانشناسان برای طراحی پروتکل‌های آزمایشی."
        - "<strong>پروژه:</strong> جعبه‌ابزارهای ایجاد آزمایش‌های واقعیت مجازی فراگیر در تحقیقات روان‌شناختی، رفتاری و شناختی (مرور دامنه‌ای)."
        - "<strong>پروژه:</strong> توسعه روش شناسایی و کمی‌سازی لرزش دست با استفاده از واقعیت مجازی: مقایسه روش‌های درمانی (در حال انجام)."

